name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile scanner.py

      - name: Build package
        run: |
          mkdir -p dist
          cp scanner.py README.md LICENSE dist/
          cd dist && zip -r ../web-vuln-scanner-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: web-vuln-scanner-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## 🔥 Auto Web Vulnerability Scanner ${{ github.ref_name }}

            ### Cara install
            - **Termux**: `pkg install python git -y && git clone <repo> && cd web-vuln-scanner && python3 scanner.py`
            - **Windows**: Install Python dari python.org (centang PATH) → `python scanner.py`
            - **Linux**: `sudo apt install python3 git -y` → `python3 scanner.py`

            > ⚠️ Gunakan hanya pada target yang Anda miliki atau punya izin tertulis.
